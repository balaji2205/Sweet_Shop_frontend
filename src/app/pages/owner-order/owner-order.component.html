<div class="page">
  <h2>📦 Owner Orders</h2>

  <p *ngIf="loading">Loading orders...</p>

  <div *ngFor="let order of orders" class="order-card">

    <div class="header">
      <strong>Order ID:</strong> {{ order._id }}
      <span class="status">{{ order.status }}</span>
    </div>

    <div class="items">
      <div *ngFor="let item of order.items">
        • {{ item.productId.name }} – {{ item.quantityInGrams }} g
      </div>
    </div>

    <div class="meta">
      💰 ₹{{ order.totalAmount }} <br />
      📞 {{ order.customerPhone }}
    </div>

    <div class="actions">
      <button
        *ngIf="order.status !== 'PREPARING'"
        (click)="updateStatus(order._id, 'PREPARING')"
      >
        Preparing
      </button>

      <button
        *ngIf="order.status === 'PREPARING'"
        (click)="updateStatus(order._id, 'READY')"
      >
        Ready
      </button>

      <button
        *ngIf="order.status === 'READY'"
        (click)="updateStatus(order._id, 'COLLECTED')"
      >
        Collected
      </button>
      <!-- DELETE BUTTON (only if COLLECTED) -->
<button *ngIf="order.status === 'COLLECTED'" class="delete-btn" (click)="deleteOrder(order._id)">
    🗑 Delete
</button>

    </div>

  </div>
</div>
